<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 64 64">

    <defs>

        <linearGradient id="green"
            x1="0%"
            y1="0%"
            x2="100%"
            y2="100%">

            <stop offset="0%" stop-color="#22C55E"/>
            <stop offset="100%" stop-color="#16A34A"/>

        </linearGradient>

    </defs>

    <!-- Background -->

    <rect
        width="64"
        height="64"
        rx="16"
        fill="#071A12"/>

    <!-- Hexagon -->

    <polygon
        points="32,8 50,18 50,46 32,56 14,46 14,18"
        fill="none"
        stroke="url(#green)"
        stroke-width="2.5"/>

    <!-- Circuit M -->

    <path
        d="
        M22 42
        L22 22
        L32 34
        L42 22
        L42 42"
        fill="none"
        stroke="white"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"/>

    <!-- Circuit Nodes -->

    <circle cx="22" cy="22" r="2.5" fill="#22C55E"/>
    <circle cx="32" cy="34" r="2.5" fill="#22C55E"/>
    <circle cx="42" cy="22" r="2.5" fill="#22C55E"/>
    <circle cx="22" cy="42" r="2.5" fill="#22C55E"/>
    <circle cx="42" cy="42" r="2.5" fill="#22C55E"/>

</svg>