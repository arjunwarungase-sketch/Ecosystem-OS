<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" role="img" aria-labelledby="title desc">
  <title id="title">Ecosystem OS</title>
  <desc id="desc">Original geometric ecosystem mark with connected nodes beside the Ecosystem OS wordmark.</desc>
  <defs>
    <linearGradient id="markGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8DE0B0"/>
      <stop offset="1" stop-color="#4D9D83"/>
    </linearGradient>
  </defs>
  <g transform="translate(20 20)">
    <rect x="0" y="0" width="120" height="120" rx="30" fill="#111923"/>
    <path d="M31 78 L53 43 L79 62 L92 35 M31 78 L73 91 L92 65 L79 62 M53 43 L92 65" fill="none" stroke="url(#markGradient)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="31" cy="78" r="8" fill="#8DE0B0"/>
    <circle cx="53" cy="43" r="8" fill="#8DE0B0"/>
    <circle cx="79" cy="62" r="8" fill="#8DE0B0"/>
    <circle cx="92" cy="35" r="7" fill="#8DE0B0"/>
    <circle cx="73" cy="91" r="7" fill="#8DE0B0"/>
    <circle cx="92" cy="65" r="7" fill="#8DE0B0"/>
  </g>
  <g fill="#F3F6F8">
    <text x="165" y="82" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="43" font-weight="650" letter-spacing="-1.2">Ecosystem</text>
    <text x="167" y="119" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="27" font-weight="500" letter-spacing="6" fill="#8DE0B0">OPERATING SYSTEM</text>
  </g>
</svg>
